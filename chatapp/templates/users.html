{% extends 'base.html' %}

{% block title %}Users{% endblock %}

{% block content %}
    <h2>Registered Users</h2>
    <ul class="user-list">
        {% for user in users %}
            <li>{{ user.username }}</li>
        {% empty %}
            <li>No users found.</li>
        {% endfor %}
    </ul>
{% endblock %}
